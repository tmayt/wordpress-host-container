services:
  wordpress:
    image: gitea.tmayt.ir/thaiostream/wp
    container_name: wp
    build: .
    ports:
      - "80:80"
    environment:
      FILEBROWSER_USER: admin
      FILEBROWSER_PASS: admin123@qwe
      DB_NAME: wordpress
      DB_USER: wordpress
      DB_PASS: 123456
      DB_ROOT_PASS: root123456
    volumes:
      - wp_html:/var/www/html
      - wp_db:/var/lib/mysql
      - filebrowser_db:/database
      - filebrowser_cfg:/config
    restart: always

volumes:
  wp_html:
  wp_db:
  filebrowser_db:
  filebrowser_cfg:
