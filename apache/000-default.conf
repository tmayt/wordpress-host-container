<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    ServerName localhost
    DocumentRoot /var/www/html
    DirectoryIndex index.php index.html

    ErrorLog ${APACHE_LOG_DIR}/error.log
    # Combined is useful; static assets are cheap — keep one access log
    CustomLog ${APACHE_LOG_DIR}/access.log combined env=!dontlog

    # VirtualHost-level rules run before .htaccess. Existing volumes often
    # ship a .htaccess with RewriteEngine Off / a wrong RewriteBase, which
    # would otherwise override Directory-context rewrite and 404 inner pages.
    RewriteEngine On
    RewriteRule ^/phpmyadmin - [L]
    RewriteRule ^/filebrowser - [L]
    RewriteRule ^/index\.php$ - [L]
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
    RewriteRule ^ /index.php [L]

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        FallbackResource /index.php
    </Directory>

    # Skip noisy probe / favicon noise from access log
    SetEnvIf Request_URI "^/favicon\.ico$" dontlog
    SetEnvIf Request_URI "^/robots\.txt$" dontlog
</VirtualHost>
