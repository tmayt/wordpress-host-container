[supervisord]
nodaemon=true
loglevel=info
logfile=/var/log/supervisord.log
pidfile=/tmp/supervisord.pid
user=root

# =======================
# MARIADB
# =======================
[program:mariadb]
command=/bin/bash -c "mkdir -p /run/mysqld && chown mysql:mysql /run/mysqld && exec su -s /bin/bash mysql -c '/usr/sbin/mysqld --console'"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

# =======================
# PHP-FPM
# =======================
[program:php-fpm]
command=/bin/bash /usr/local/bin/php-fpm-start.sh
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

# =======================
# APACHE
# =======================
[program:apache]
command=/bin/bash -c "source /etc/apache2/envvars && exec /usr/sbin/apache2 -D FOREGROUND"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

# =======================
# FILEBROWSER
# =======================
[program:filebrowser]
command=/bin/bash /usr/local/bin/filebrowser-start.sh
autostart=true
autorestart=true
priority=40
startsecs=3
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

# =======================
# INIT SCRIPT
# =======================
[program:init]
command=/bin/bash /init.sh
autostart=true
autorestart=false
priority=50
startretries=0
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
