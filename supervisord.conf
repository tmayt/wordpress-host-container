[supervisord]
nodaemon=true
loglevel=info
logfile=/var/log/supervisord.log
pidfile=/tmp/supervisord.pid
user=root

# =======================
# APACHE
# =======================
[program:apache]
command=/bin/bash -c "source /etc/apache2/envvars && exec /usr/sbin/apache2 -D FOREGROUND"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

# =======================
# MARIADB
# =======================
[program:mariadb]
command=/bin/bash -c "mkdir -p /run/mysqld && chown mysql:mysql /run/mysqld && exec su -s /bin/bash mysql -c '/usr/sbin/mysqld --console'"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

# =======================
# FILEBROWSER
# =======================
[program:filebrowser]
command=/bin/bash -c "sleep 15 && exec /usr/local/bin/filebrowser -a 0.0.0.0 -p 8080 --database /database/filebrowser.db --root /var/www/html"
user=www-data
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

# =======================
# INIT SCRIPT
# =======================
[program:init]
command=/bin/bash /init.sh
autostart=true
autorestart=false
startretries=0
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0