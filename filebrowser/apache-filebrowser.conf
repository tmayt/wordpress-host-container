# Reverse-proxy FileBrowser on a path (like phpMyAdmin).
# FileBrowser itself listens only on 127.0.0.1:8080 inside the container.
ProxyPreserveHost On
ProxyRequests Off

<Location /filebrowser>
    ProxyPass http://127.0.0.1:8080/filebrowser
    ProxyPassReverse http://127.0.0.1:8080/filebrowser
    Require all granted
</Location>
